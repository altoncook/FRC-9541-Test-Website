name: Run FRC Script

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  run-js:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code so the runner can see script.js
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Uses a modern Node version

      # 3. Install dependencies (uncomment if you have a package.json)
      - name: Install dependencies
        run: npm ci

      # 4. Run the JavaScript file with injected secrets
      - name: Run JavaScript file
        run: node team-data-test/script/update_data.js
        env:
          FRC_API_KEY: ${{ secrets.FRC_API_KEY }}
          FRC_USERNAME: ${{ secrets.FRC_USERNAME }}